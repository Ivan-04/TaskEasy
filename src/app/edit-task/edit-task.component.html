<mat-card class="edit-card">
  <mat-card-title>Edit task</mat-card-title>

  <mat-card-content>
    <form [formGroup]="form" class="edit-grid">
      <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput formControlName="title" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Description</mat-label>
        <textarea matInput rows="3" formControlName="description"></textarea>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Difficulty</mat-label>
        <mat-select formControlName="difficulty">
          <mat-option [value]="1">1</mat-option>
          <mat-option [value]="2">2</mat-option>
          <mat-option [value]="3">3</mat-option>
          <mat-option [value]="5">5</mat-option>
          <mat-option [value]="8">8</mat-option>
          <mat-option [value]="13">13</mat-option>
          <mat-option [value]="21">21</mat-option>
        </mat-select>
      </mat-form-field>

      <div class="edit-actions">
        <button mat-raised-button color="primary" type="button" (click)="save()" [disabled]="form.invalid">Save</button>

        <button mat-button type="button" (click)="cancel.emit()">Cancel</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
